<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미리캔버스 배경 변환기</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#18181b;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{width:min(860px,calc(100% - 32px));margin:48px auto}.card{background:#fff;border:1px solid #e4e4e7;border-radius:20px;padding:32px;box-shadow:0 10px 35px #0000000f}h1{margin:0;font-size:27px}.sub{margin:8px 0 24px;color:#71717a;font-size:14px}.drop{display:block;border:2px dashed #d4d4d8;border-radius:16px;padding:52px 24px;text-align:center;cursor:pointer;background:#fafafa}.drop.drag{border-color:#18181b;background:#f4f4f5}.drop strong{display:block;font-size:17px;margin-bottom:8px}.drop span{color:#71717a;font-size:13px;line-height:1.6}.file{display:none}.toolbar{display:none;margin-top:18px;justify-content:space-between;align-items:center}.count{font-size:13px;color:#52525b}.list{display:grid;gap:10px;margin-top:12px}.item{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid #e4e4e7;border-radius:12px}.thumb{width:90px;height:58px;object-fit:cover;border-radius:8px;background:#f1f1f3}.original{font-size:12px;color:#71717a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}.name{width:100%;padding:10px;border:1px solid #d4d4d8;border-radius:9px;font-size:14px}.remove,.clear{width:auto;margin:0;padding:9px 12px;background:#f4f4f5;color:#18181b;font-size:13px}.actions{display:none}.btn{width:100%;margin-top:14px;border:0;border-radius:11px;padding:14px;background:#18181b;color:#fff;font-size:15px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.4}.note{font-size:12px;color:#71717a;line-height:1.7;margin-top:16px}@media(max-width:600px){.wrap{width:calc(100% - 20px);margin:24px auto}.card{padding:22px}.item{grid-template-columns:64px 1fr auto}.thumb{width:64px;height:46px}}</style></head><body><div class="wrap"><div class="card"><h1>미리캔버스 배경 변환기</h1><p class="sub">PNG/JPG 여러 장을 한 번에 16:9 · 4444×2500px · JPG로 변환</p><label class="drop" id="drop"><strong>이미지를 여기에 끌어다 놓거나 클릭해서 선택</strong><span>PNG / JPG / JPEG 여러 장을 동시에 선택할 수 있습니다.<br>파일은 서버로 업로드되지 않습니다.</span><input class="file" id="file" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg" multiple></label><div class="toolbar" id="toolbar"><span class="count" id="count"></span><button class="clear" id="clear">전체 삭제</button></div><div class="list" id="list"></div><div class="actions" id="actions"><button class="btn" id="save">전체 JPG 저장하기</button></div><p class="note">각 이미지를 16:9로 중앙 크롭하고 4444×2500px JPG로 변환합니다. 각 항목의 이름으로 저장됩니다.</p></div></div><script>
const D=document,drop=D.getElementById("drop"),file=D.getElementById("file"),list=D.getElementById("list"),toolbar=D.getElementById("toolbar"),count=D.getElementById("count"),actions=D.getElementById("actions"),save=D.getElementById("save"),clear=D.getElementById("clear");let items=[];
drop.onclick=()=>file.click();["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("drag")}));drop.ondrop=e=>add(e.dataTransfer.files);file.onchange=e=>{add(e.target.files);file.value=""};clear.onclick=()=>{items=[];render()};
function add(files){[...files].filter(f=>/^image\/(png|jpeg)$/.test(f.type)).forEach(f=>items.push({f,u:URL.createObjectURL(f),n:f.name.replace(/\.[^.]+$/,"")}));render()}
function render(){list.innerHTML="";items.forEach((x,i)=>{let r=D.createElement("div"),im=D.createElement("img"),m=D.createElement("div"),o=D.createElement("div"),n=D.createElement("input"),b=D.createElement("button");r.className="item";im.className="thumb";im.src=x.u;o.className="original";o.textContent=x.f.name;n.className="name";n.value=x.n;n.oninput=()=>x.n=n.value;b.className="remove";b.textContent="삭제";b.onclick=()=>{items.splice(i,1);render()};m.append(o,n);r.append(im,m,b);list.append(r)});toolbar.style.display=items.length?"flex":"none";actions.style.display=items.length?"block":"none";count.textContent=items.length?items.length+"개 이미지 준비됨":""}
function convert(x){return new Promise((ok,no)=>{let im=new Image();im.onload=()=>{let W=4444,H=2500,R=W/H,s=im.naturalWidth/im.naturalHeight,sx=0,sy=0,sw=im.naturalWidth,sh=im.naturalHeight;if(s>R){sw=Math.round(im.naturalHeight*R);sx=(im.naturalWidth-sw)/2}else if(s<R){sh=Math.round(im.naturalWidth/R);sy=(im.naturalHeight-sh)/2}let c=D.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,W,H);c.toBlob(ok,"image/jpeg",.95)};im.src=x.u})}
save.onclick=async()=>{save.disabled=true;save.textContent="변환 중...";for(let x of items){let blob=await convert(x),u=URL.createObjectURL(blob),a=D.createElement("a");a.href=u;a.download=(x.n.trim()||"background")+".jpg";a.click();await new Promise(r=>setTimeout(r,300));URL.revokeObjectURL(u)}save.disabled=false;save.textContent="전체 JPG 저장하기"};
</script></body></html>
