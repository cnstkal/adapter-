<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미리캔버스 배경 변환기</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#18181b;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:56px auto}.card{background:#fff;border:1px solid #e4e4e7;border-radius:20px;padding:32px;box-shadow:0 10px 35px rgba(0,0,0,.06)}h1{margin:0;font-size:27px}.sub{margin:8px 0 26px;color:#71717a;font-size:14px}.drop{display:block;width:100%;border:2px dashed #d4d4d8;border-radius:16px;padding:52px 24px;text-align:center;cursor:pointer;background:#fafafa}.drop:hover{border-color:#a1a1aa}.drop.drag{border-color:#18181b;background:#f4f4f5}.drop strong{display:block;font-size:17px;margin-bottom:8px}.drop span{display:block;color:#71717a;font-size:13px}.file-input{display:none}.preview{margin-top:24px;display:none}.preview-frame{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#f1f1f3;border:1px solid #e4e4e7}.preview img{width:100%;height:100%;object-fit:contain}.info{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tag{background:#f4f4f5;padding:7px 11px;border-radius:999px;font-size:12px;color:#52525b}.namebox{margin-top:20px}.namebox label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.namebox input{display:block;width:100%;padding:13px 14px;border:1px solid #d4d4d8;border-radius:10px;font-size:15px;outline:none}.namebox input:focus{border-color:#18181b}button{width:100%;margin-top:14px;border:0;border-radius:11px;padding:14px;background:#18181b;color:#fff;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.note{font-size:12px;color:#71717a;margin:16px 0 0;line-height:1.7}@media(max-width:600px){.wrap{width:calc(100% - 20px);margin:24px auto}.card{padding:22px}}</style></head><body><div class="wrap"><div class="card"><h1>미리캔버스 배경 변환기</h1><p class="sub">이미지를 16:9 · 4444×2500px · JPG로 자동 변환</p><label class="drop" id="drop"><strong>이미지를 여기에 넣거나 클릭해서 선택</strong><span>PNG / JPG / JPEG · 파일은 서버로 업로드되지 않습니다.</span><input class="file-input" id="file" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg"></label><div class="preview" id="preview"><div class="preview-frame"><img id="img" alt="이미지 미리보기"></div><div class="info"><span class="tag" id="before"></span><span class="tag">출력 4444 × 2500px</span><span class="tag">JPG</span></div><div class="namebox"><label for="filename">저장할 파일 이름</label><input id="filename" type="text" placeholder="예: 글래스모피즘"></div><button id="save" disabled>JPG로 저장하기</button></div><p class="note">원본을 16:9에 맞게 중앙 기준으로 크롭한 뒤 4444×2500px로 리사이즈합니다. 입력한 이름으로 JPG 파일이 저장됩니다.</p></div></div><script>
const drop=document.getElementById('drop'),fileInput=document.getElementById('file'),preview=document.getElementById('preview'),img=document.getElementById('img'),before=document.getElementById('before'),save=document.getElementById('save'),filename=document.getElementById('filename');let current=null,objectUrl=null;
drop.addEventListener('click',()=>fileInput.click());['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>handle(e.dataTransfer.files[0]));fileInput.addEventListener('change',e=>handle(e.target.files[0]));
function handle(file){if(!file||!file.type.startsWith('image/'))return;current=file;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(file);img.src=objectUrl;preview.style.display='block';save.disabled=false;img.onload=()=>before.textContent=`원본 ${img.naturalWidth} × ${img.naturalHeight}px`;filename.value=file.name.replace(/\.[^.]+$/,'');filename.focus();filename.select();}
save.addEventListener('click',()=>{if(!current)return;const image=new Image();image.onload=()=>{const targetW=4444,targetH=2500,targetR=targetW/targetH,srcR=image.naturalWidth/image.naturalHeight;let sx=0,sy=0,sw=image.naturalWidth,sh=image.naturalHeight;if(srcR>targetR){sw=Math.round(image.naturalHeight*targetR);sx=Math.floor((image.naturalWidth-sw)/2)}else if(srcR<targetR){sh=Math.round(image.naturalWidth/targetR);sy=Math.floor((image.naturalHeight-sh)/2)}const c=document.createElement('canvas');c.width=targetW;c.height=targetH;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(image,sx,sy,sw,sh,0,0,targetW,targetH);c.toBlob(blob=>{if(!blob)return;const safe=(filename.value.trim()||'background').replace(/[\\/:*?"<>|]/g,'_'),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safe+'.jpg';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/jpeg',.95)};image.src=objectUrl});
</script></body></html>
