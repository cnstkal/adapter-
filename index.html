<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>미리캔버스 배경 변환기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#18181b;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:40px auto;padding:24px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:18px;padding:28px;box-shadow:0 8px 30px #0000000a}
h1{margin:0 0 8px;font-size:28px}.sub{color:#71717a;margin:0 0 24px}
.drop{border:2px dashed #d4d4d8;border-radius:16px;padding:44px 20px;text-align:center;cursor:pointer;background:#fafafa;transition:.15s}
.drop.drag{border-color:#111;background:#f4f4f5}.drop strong{display:block;font-size:18px;margin-bottom:8px}.drop span{color:#71717a;font-size:14px}
input{display:none}.preview{margin-top:22px;display:none}.preview img{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 50%/20px 20px}
.info{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.tag{background:#f4f4f5;padding:8px 12px;border-radius:999px;font-size:13px}
button{width:100%;margin-top:20px;border:0;border-radius:12px;padding:15px;background:#111;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
.note{font-size:13px;color:#71717a;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>미리캔버스 배경 변환기</h1>
<p class="sub">PNG/JPG 이미지를 16:9 · 4444×2500px · JPG로 자동 변환</p>
<label class="drop" id="drop">
<strong>이미지를 여기에 넣거나 클릭해서 선택</strong>
<span>PNG / JPG / JPEG · 파일은 서버로 업로드되지 않습니다.</span>
<input id="file" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg">
</label>
<div class="preview" id="preview">
<img id="img" alt="미리보기">
<div class="info"><span class="tag" id="before"></span><span class="tag">출력 4444 × 2500px</span><span class="tag">JPG</span></div>
<button id="save" disabled>JPG로 저장하기</button>
</div>
<p class="note">원본을 16:9에 맞게 중앙 기준으로 크롭한 뒤 4444×2500px로 리사이즈합니다. 화면 전체를 채우는 배경 이미지를 대상으로 합니다.</p>
</div></div>
<script>
const drop=document.getElementById('drop'),fileInput=document.getElementById('file'),preview=document.getElementById('preview'),img=document.getElementById('img'),before=document.getElementById('before'),save=document.getElementById('save');
let current=null,objectUrl=null;
drop.addEventListener('click',()=>fileInput.click());
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>handle(e.dataTransfer.files[0]));
fileInput.addEventListener('change',e=>handle(e.target.files[0]));
function handle(file){
 if(!file || !file.type.startsWith('image/')) return;
 current=file;
 if(objectUrl) URL.revokeObjectURL(objectUrl);
 objectUrl=URL.createObjectURL(file);
 img.src=objectUrl; preview.style.display='block'; save.disabled=false;
 img.onload=()=>before.textContent=`원본 ${img.naturalWidth} × ${img.naturalHeight}px`;
}
save.addEventListener('click',()=>{
 if(!current)return;
 const image=new Image();
 image.onload=()=>{
   const targetW=4444,targetH=2500,targetR=targetW/targetH;
   const srcR=image.naturalWidth/image.naturalHeight;
   let sx=0,sy=0,sw=image.naturalWidth,sh=image.naturalHeight;
   if(srcR>targetR){sw=Math.round(image.naturalHeight*targetR);sx=Math.floor((image.naturalWidth-sw)/2)}
   else if(srcR<targetR){sh=Math.round(image.naturalWidth/targetR);sy=Math.floor((image.naturalHeight-sh)/2)}
   const c=document.createElement('canvas');c.width=targetW;c.height=targetH;
   const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
   ctx.drawImage(image,sx,sy,sw,sh,0,0,targetW,targetH);
   c.toBlob(blob=>{
     const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(current.name.replace(/\.[^.]+$/,'')||'background')+'_4444x2500.jpg';a.click();
     setTimeout(()=>URL.revokeObjectURL(a.href),1000);
   },'image/jpeg',0.95);
 };
 image.src=objectUrl;
});
</script>
</body></html>
